[pytest]
testpaths = tests
addopts = -ra
markers =
    unit: regression of automation internals with test doubles; not a functional route result
    automated: executable E2E test that can run when the configured environment is ready
    smoke: short stable flow
    initial: initial PDV scenarios
    products: product and sale scenarios
    sales: real sale and payment scenarios
    recovery: scenario that intentionally validates pending-sale recovery
    discounts: discount scenarios
    configuration: read-only configuration checks
    par_configuration(scenario_id): PAR scenario requiring locally supplied expected parameter values
    manual: requires hardware/external service or manual execution by reviewer decision (including CFG-01/CFG-02)
    blocked(reason): missing data, shared configuration or unverified selector; deselected before fixtures and reported as BLOCKED
    fresh_instance: test requires a new SATPDV process instead of the shared session instance
