[pytest]
testpaths = tests
addopts = -ra
markers =
    automated: executable E2E test that can run when the configured environment is ready
    smoke: short stable flow
    initial: initial PDV scenarios
    products: product and sale scenarios
    recovery: scenario that intentionally validates pending-sale recovery
    discounts: discount scenarios
    manual: requires hardware or external service and is not executed by the PoC
    blocked: requires an unavailable dependency or verified runtime selector
